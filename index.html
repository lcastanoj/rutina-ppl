<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutina PPL lumbar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL Lumbar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de gym, directa, sin adornos
   IDEA: la pizarra junto al rack y los discos de competición (rojo 25, azul 20)
   PICTURE: la propia sesión: series con check, dock de descanso fijo abajo
   COLOUR and TYPE: goma negra, tiza, rojo disco, azul disco; Barlow Condensed + Barlow
   LAYOUT: barra fija con cronómetro, semana y día, tarjetas de ejercicio, dock abajo */
:root{color-scheme:dark;--bg:#0f1113;--panel:#181b1e;--panel2:#20242838;--card:#1b1f22;--line:#2c3237;--ink:#eceae4;--mute:#9aa1a7;--red:#e0342b;--blue:#3b80d4;--ok:#36a865;--warn:#e7a23a;--hd:'Barlow Condensed',Impact,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:130px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--hd);font-weight:700;line-height:1.05;margin:0;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:20;background:rgba(15,17,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{flex:1}.brand h1{font-size:24px}.brand small{color:var(--mute);font-size:13px}
.sess{display:flex;align-items:center;gap:8px}
.clock{font:700 28px/1 var(--hd);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.clock.run{color:var(--ink)}.clock.off{color:var(--mute)}
.tabs{display:flex;gap:4px;padding-bottom:8px}
.tabs button{flex:1;min-height:42px;border-radius:10px;background:var(--panel);font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--ink);color:#111}
.btn{min-height:46px;padding:0 16px;border-radius:12px;background:var(--red);color:#fff;font-weight:700}
.btn.blue{background:var(--blue)}.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.4}
.lbl{font-size:13px;color:var(--mute);font-weight:600;margin:16px 0 6px}
.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.weeks button{min-height:48px;border-radius:10px;background:var(--panel);font:700 22px/1 var(--hd);border:2px solid transparent;position:relative}
.weeks button.dl{color:var(--warn)}
.weeks button[aria-pressed=true]{border-color:var(--red);background:#2a1716}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.days button{min-height:68px;border-radius:12px;background:var(--panel);text-align:left;padding:8px 10px;border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between}
.days button b{font:700 20px/1 var(--hd)}.days button span{font-size:12px;color:var(--mute)}
.days button[aria-pressed=true]{border-color:var(--blue);background:#14202e}
.mini{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}.mini i{display:block;height:100%;background:var(--ok)}
.dayhead{margin-top:18px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#1d2125,#15181b);border:1px solid var(--line)}
.dayhead h2{font-size:38px}
.dayhead .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.pill.r{background:#341614;border-color:#5a2420}.pill.b{background:#132235;border-color:#24426a}.pill.w{background:#36290f;border-color:#5f4718;color:#f3c77a}
.dayhead p{margin:6px 0 0;color:#c9ccce;font-size:15px}
.focus{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}.focus>div{background:#121518;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.focus small{display:block;font-size:12px;color:var(--mute);font-weight:600}.focus b{font-size:15px;line-height:1.3;display:block}.focus span{font-size:14px;color:#c9cdd0;line-height:1.3;display:block}
@media(max-width:420px){.focus{grid-template-columns:1fr}}
.prog{margin-top:12px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .3s}
.prog b{font:700 20px/1 var(--hd);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
details.box{margin-top:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
details.box summary{min-height:50px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer;list-style:none}
details.box summary::after{content:'+';margin-left:auto;font-size:22px;color:var(--mute)}
details.box[open] summary::after{content:'–'}
details.box .in{padding:0 14px 14px}
ol.wu{margin:0;padding-left:20px}ol.wu li{margin:6px 0}
.ex{margin-top:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.ex.done{border-color:#25553a}
.exh{padding:14px 14px 8px}
.exh .t{display:flex;gap:8px;align-items:flex-start}
.exh h3{font-size:24px;flex:1}
.num{font:700 15px/1 var(--hd);color:var(--mute);padding-top:5px}
.star{color:var(--warn);font-size:13px;font-weight:700;white-space:nowrap;padding-top:4px}
.exh .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mus{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.mus span{font-size:13px;font-weight:600;padding:3px 9px;border-radius:7px;line-height:1.3}.mus .m1{background:#ece9e2;color:#141414}.mus .m1::before{content:'Principal · ';font-weight:500;opacity:.7}.mus .m2{border:1px dashed #5b636a;color:#c9cdd0}.mus .m2::before{content:'Secundario · ';opacity:.7}
.cue{color:#c3c7ca;font-size:14.5px;margin:8px 0 0}
.altinfo{font-size:13px;color:var(--warn);margin-top:6px}
.prev{font-size:13px;color:var(--mute);margin-top:6px}.prev b{color:#cfd3d6;font-weight:600}
.sets{padding:4px 10px 10px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 58px;gap:7px;align-items:center;padding:4px 0}
.set.iso{grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) 58px}
.set .n{font:700 18px/1 var(--hd);color:var(--mute);text-align:center}
.set input{width:100%;height:50px;border-radius:10px;border:1px solid var(--line);background:#0f1214;color:var(--ink);font:600 18px Barlow,sans-serif;text-align:center;padding:0 4px}
.set input::placeholder{color:#5f676e;font-weight:500}
.chk{height:50px;border-radius:12px;border:2px solid var(--line);background:#121518;font-size:24px;font-weight:700;color:#4a5157}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.set.on input{border-color:#25553a}
.isob{height:50px;border-radius:10px;background:#14202e;border:1px solid #24426a;font-weight:700;font-size:15px}
.exf{display:flex;gap:6px;padding:0 10px 12px}
.exf .btn{flex:1}
.molp{padding:0 12px 12px}.molb.g{color:#7fd6a1}.molb.a{color:#f3c77a;border-color:#5f4718}.molb.x{color:#ff8a83;border-color:#5a2420}
.start{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}.start[hidden]{display:none}
.start .days button.sug{border-color:#5f4718}.sugt{font-size:11px;color:#f3c77a;font-weight:700}
.prev2{margin-top:14px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.prev2 h3{font-size:26px}.prev2 ul{margin:8px 0 0;padding-left:20px}.prev2 li{margin:4px 0;color:#d3d6d8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.stats>div{background:#0f1214;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font:700 22px/1.1 var(--hd);font-variant-numeric:tabular-nums}.stats small{font-size:12px;color:var(--mute)}
.finish{margin-top:18px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.finish h2{font-size:28px}
.pain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.pain button{min-height:50px;border-radius:10px;font:700 22px/1 var(--hd);background:#121518;border:2px solid var(--line)}
.pain button.g{color:#7fd6a1}.pain button.a{color:#f3c77a}.pain button.x{color:#ff8a83}
.pain button[aria-pressed=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14.5px}
.msg.w{background:#36290f;color:#f6d79b}.msg.x{background:#3a1513;color:#ffc2bd}.msg.ok{background:#11301f;color:#a6e7bf}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.row .btn{flex:1 1 140px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0b0d0e;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s}
.dock.show{transform:none}
.dockin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.dockt{flex:1}.dockt small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockt b{font:700 46px/1 var(--hd);font-variant-numeric:tabular-nums}
.dock.end{background:#11301f}.dock.end b{color:#7fe0a5}
.dock .rb{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:760px;margin:0 auto 8px}.dock .rb i{display:block;height:100%;background:var(--red)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-height:90vh;overflow:auto}
.sheet h3{font-size:26px}
.isoBig{font:700 clamp(84px,30vw,140px)/1 var(--hd);text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.isoL{text-align:center;font:700 26px/1.1 var(--hd)}.isoS{text-align:center;color:var(--mute)}
.iso-hold .isoBig{color:#ff8a83}.iso-rest .isoBig{color:#8fb9ee}
.guide h2{font-size:30px;margin:26px 0 8px}.guide h3{font-size:22px;margin:16px 0 6px}
.guide p,.guide li{color:#d3d6d8}.guide ul{padding-left:20px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:2px;margin-right:4px;white-space:nowrap}
.tag.ev{background:#132235;color:#9cc4f2}.tag.cr{background:#36290f;color:#f3c77a}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:130px;border-radius:10px;border:1px solid var(--line);background:#0f1214;color:var(--ink);font:14px/1.4 ui-monospace,monospace;padding:10px}
.file{display:block;margin-top:8px}
.file input{font-size:16px;color:var(--mute);width:100%}
.sum{margin-top:12px;padding:14px;border-radius:12px;background:#121518;border:1px solid var(--line)}
.sum li{margin:3px 0}
.note{font-size:13px;color:var(--mute)}
@media(max-width:600px){table{font-size:13.5px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.2em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.8em;margin-inline-start:-7.2em;white-space:normal;color:var(--mute);font-size:12px;font-weight:600}.stack td:empty{display:none}
.dayhead h2{font-size:32px}.exh h3{font-size:22px}.brand h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topin">
    <div class="brand"><h1>PPL · 8 semanas</h1><small id="subt">Espalda y bíceps ★</small></div>
    <div class="sess"><div class="clock off" id="clock">0:00</div><button class="btn sm blue" id="sessBtn">Iniciar</button></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="train">Entreno</button>
    <button role="tab" aria-selected="false" data-tab="guide">Guía</button>
    <button role="tab" aria-selected="false" data-tab="data">Datos</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-train"></section>
  <section id="v-guide" class="guide" hidden></section>
  <section id="v-data" hidden></section>
</main>

<div class="dock" id="dock" aria-live="polite">
  <div class="rb"><i id="dockBar"></i></div>
  <div class="dockin">
    <div class="dockt"><small id="dockName">Descanso</small><b id="dockTime">0:00</b></div>
    <button class="btn ghost sm" data-rest="-15">−15</button>
    <button class="btn ghost sm" data-rest="15">+15</button>
    <button class="btn sm" data-rest="skip">Listo</button>
  </div>
</div>

<div class="modal" id="isoM" hidden><div class="sheet" id="isoS">
  <div class="isoL" id="isoL">Prepárate</div>
  <div class="isoBig" id="isoT">3</div>
  <div class="isoS" id="isoC"></div>
  <div class="row"><button class="btn ghost" id="isoX">Cancelar</button><button class="btn" id="isoDone">Terminar serie</button></div>
</div></div>

<div class="start" id="startM" hidden><div class="wrap">
  <h2 style="font-size:40px;margin-top:18px">¿Qué toca hoy?</h2>
  <div id="startBody"></div>
</div></div>
<div class="modal" id="endM" hidden><div class="sheet" id="endS"></div></div>
<div class="modal" id="dlg" hidden><div class="sheet">
  <h3 id="dlgT"></h3><div id="dlgB" style="margin-top:8px;color:#d3d6d8"></div>
  <div class="row"><button class="btn ghost" id="dlgNo">Cancelar</button><button class="btn" id="dlgOk">Confirmar</button></div>
</div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fmtRest=s=>s>=60?(Math.floor(s/60)+':'+String(s%60).padStart(2,'0')):s+' s';

/* ---------- PROGRAMA ---------- */
const DAYS=[
 {id:'pushA',n:'Push A',d:'Lun',f:'Pecho',fp:'Pectoral (máquina Hammer y poleas)',fs:'Tríceps, sobre todo la cabeza larga · deltoides lateral',fx:'Día de pecho: máquina Hammer pesada y poleas, donde mejor lo notas. Puedes apretar cerca del fallo sin spotter.'},
 {id:'pullA',n:'Pull A',d:'Mar',f:'Dorsal',fp:'Dorsal ancho (tirones verticales y pullover)',fs:'Bíceps cabeza larga · braquial · deltoides posterior',fx:'Día de amplitud: jalón y pullover para el dorsal; remo con apoyo de pecho como complemento.'},
 {id:'legsA',n:'Legs A',d:'Mié',f:'Cuádriceps',fp:'Cuádriceps',fs:'Glúteo · isquiotibiales (solo un ejercicio de curl) · gemelos',fx:'Día dominante de rodilla: hack, prensa, búlgara y extensiones.'},
 {id:'pushB',n:'Push B',d:'Jue',f:'Pecho alto · hombro',fp:'Pectoral superior y deltoides',fs:'Tríceps · braquial (curl martillo extra)',fx:'Inclinado pesado en Smith con topes para abrir y más volumen de deltoides lateral.'},
 {id:'pullB',n:'Pull B',d:'Vie',f:'Espalda media',fp:'Espalda media (romboides, trapecio medio) y dorsal',fs:'Bíceps cabeza corta · deltoides posterior',fx:'Día de grosor: dominadas y remos horizontales; el dorsal sigue trabajando, pero con más tirón horizontal que el Pull A.'},
 {id:'legsB',n:'Legs B',d:'Sáb',f:'Glúteo · femoral',fp:'Glúteo mayor e isquiotibiales',fs:'Cuádriceps (prensa con pies altos y zancadas) · glúteo medio · dorsal (jalón extra)',fx:'Día dominante de cadera, pero sin bisagras cargadas: hip thrust y curl femoral sustituyen al peso muerto rumano.'}];
const dayName=id=>(DAYS.find(d=>d.id===id)||{}).n||id;
const WEEKS=[null,
 {t:'Calibración',rir:'3',rirI:'2–3',add:0,txt:'Encuentra cargas con margen. Anota todo: es tu referencia para las 7 semanas siguientes.'},
 {t:'Acumulación',rir:'2',rirI:'2',add:0,txt:'Sube carga o reps donde la semana 1 te quedó fácil. Técnica idéntica.'},
 {t:'Acumulación +',rir:'2',rirI:'1–2',add:1,txt:'+1 serie en los ejercicios ★ (espalda y bíceps). Bloque lumbar pasa a fase 2 si cumples los criterios.'},
 {t:'Pico bloque 1',rir:'1–2',rirI:'1',add:1,txt:'Semana más dura del bloque 1. Si el dolor sube, quita primero las series extra ★.'},
 {t:'Descarga',rir:'3–4',rirI:'3',add:0,dl:1,txt:'≈60 % de las series y cargas −10–15 %. Bloque lumbar vuelve al volumen de fase 1. No es opcional: aquí se consolida.'},
 {t:'Bloque 2',rir:'2',rirI:'1–2',add:1,txt:'Retoma con las cargas de semana 3–4. Bloque lumbar fase 3 si las semanas 3–4 fueron sin dolor.'},
 {t:'Bloque 2 +',rir:'1–2',rirI:'1',add:1,txt:'Empuja la doble progresión. Sentadilla con barra opcional solo si cumples los criterios (Guía).'},
 {t:'Pico final',rir:'1',rirI:'0–1',add:1,txt:'Última serie de aislamiento cerca del fallo. Nunca al fallo en compuestos ni en el bloque lumbar. Después: semana de descarga.'}];
const phase=w=>w<=2?0:w<=4?1:w===5?0:2;

/* e(id,nombre,series,reps,descanso,{p:prioridad,i:aislamiento},cue,[altNombre,altCue]) */
const E=(id,n,s,r,rest,f,cue,alt)=>({id,n,s,r,rest,p:!!f.p,i:!!f.i,opt:f.opt||'',cue,alt:{n:alt[0],c:alt[1]}});
const C=(id,n,ph,cue,alt,rest=40)=>({id,n,core:1,ph,cue,alt:{n:alt[0],c:alt[1]},rest});

const coreBack=x=>[
 C(x+'bd','Bird dog con pausa',[{s:3,r:'6/lado · 5 s',h:5,k:12,g:2},{s:3,r:'8/lado · 8 s',h:8,k:16,g:2},{s:3,r:'8/lado · 10 s',h:10,k:16,g:2,c:'Fase 3: tobillera ligera o banda en el pie.'}],
  'Columna neutra y pelvis quieta: imagina un vaso de agua sobre la zona lumbar. Extiende brazo y pierna contrarios lento, sin arquear.',['Bird dog parcial (solo brazos o solo piernas)','Misma pausa. Úsalo si el completo te hace perder el control de la pelvis.']),

const KEY='ppl-lumbar-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||typeof S.log!=='object'||!S.log)S={v:1,w:1,d:'pushA',log:{}};
if(!(S.w>=1&&S.w<=8))S.w=1;if(!EX[S.d])S.d='pushA';
let storeOK=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true}catch(e){storeOK=false}};
const L=(w,d,create)=>{const k=w+'|'+d;if(!S.log[k]&&create)S.log[k]={ex:{},alt:{},pain:null,t0:null,t1:null};return S.log[k]};
const cur=c=>L(S.w,S.d,c);
const isAlt=(ex,l=cur())=>!!(l&&l.alt&&l.alt[ex.id]);
const keyOf=(ex,l)=>ex.id+(isAlt(ex,l)?'~a':'');
const MODES={normal:{t:'Sesión completa',c:'r'},ajustada:{t:'Sesión ajustada',c:'w'},recuperacion:{t:'Recuperación',c:'x'}};
const modeOf=(w,d)=>{const l=L(w,d);return l&&MODES[l.mode]?l.mode:'normal'};
const modeFor=(v,d)=>v==null||v<=2?'normal':v<=4?'ajustada':(/^(pull|legs)/.test(d)?'recuperacion':'ajustada');
const phaseFor=(w,d)=>{const m=modeOf(w,d);return m==='normal'?phase(w):m==='ajustada'?Math.max(0,phase(w)-1):0};
function spec(ex,w,d=S.d){
  const m=modeOf(w,d);
  if(ex.core){const ph=phaseFor(w,d),p=ex.ph[ph];return{sets:Math.min(p.s,2),reps:p.r,rest:ex.rest,rir:'Control, sin dolor',iso:p.h?{h:p.h,k:p.k||1,g:p.g||3}:null,name:p.n||ex.n,note:p.c||'',fase:ph+1}}
  const W=WEEKS[w],adj=m!=='normal',l=L(w,d);return{sets:W.dl?Math.max(1,Math.round(ex.s*.6)):ex.s+(ex.p&&!adj?W.add:0),reps:ex.r,rest:ex.rest,rir:adj&&!W.dl?(ex.i?W.rirI:W.rir).replace(/\d/g,n=>+n+1)+' (hoy +1)':(ex.i?W.rirI:W.rir),iso:null,name:ex.n,note:'',hidden:m==='recuperacion'&&!(l&&l.showAll)};
}
function setsOf(w,d,ex){const l=L(w,d);const e=l&&l.ex[keyOf(ex,l)];return e?e.s:[]}
function getSet(ex,i){const l=cur(true);const k=keyOf(ex,l);const e=l.ex[k]||(l.ex[k]={s:[]});while(e.s.length<=i)e.s.push({d:0,w:'',r:''});return e.s[i]}
function prog(w,d){let t=0,n=0;for(const ex of EX[d]){const sp=spec(ex,w,d);if(sp.hidden)continue;const s=setsOf(w,d,ex);t+=sp.sets;for(let i=0;i<sp.sets;i++)if(s[i]&&s[i].d)n++}return{t,n}}
function prev(ex){const k=keyOf(ex);for(let pw=S.w-1;pw>=1;pw--){const l=S.log[pw+'|'+S.d];const e=l&&l.ex[k];if(e&&e.s.some(x=>x.w||x.r))return{pw,s:e.s}}return null}

let ac=null;
const audio=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
function beep(n=3,f=880,dur=.16){if(!ac)return;try{const t=ac.currentTime;for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.0001,t+i*.28);g.gain.exponentialRampToValueAtTime(.35,t+i*.28+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.28+dur);o.connect(g).connect(ac.destination);o.start(t+i*.28);o.stop(t+i*.28+dur+.02)}}catch(e){}}

const VALID=new RegExp('^[1-8]\\|('+DAYS.map(d=>d.id).join('|')+')$');
function summarize(st){
  const keys=Object.keys(st.log||{}).filter(k=>VALID.test(k));let sets=0,vals=0,pre=0,mols=0;const pains=[],weeks=new Set();
  for(const k of keys){const l=st.log[k],[wk,d]=k.split('|');let any=false;
    for(const e of Object.values(l.ex||{}))for(const s of(e.s||[])){if(s.d){sets++;any=true}if(s.w||s.r){vals++;any=true}}
    if(l.pre!=null){pre++;any=true}for(const e of Object.values(l.ex||{}))if(e.m!=null){mols++;any=true}if(l.pain!=null){pains.push(`S${wk} ${dayName(d)}: ${l.pain}/10`);any=true}if(l.t0)any=true;if(any)weeks.add(+wk)}

function clean(raw){
  const st=raw&&raw.app==='rutina-ppl-lumbar'&&raw.state?raw.state:raw;
  if(!st||typeof st.log!=='object'||!st.log)throw new Error('El archivo no tiene el formato de esta app.');
  const log={};const str=v=>String(v??'').slice(0,12);const num=v=>typeof v==='number'&&isFinite(v)?v:null;
  for(const[k,l]of Object.entries(st.log)){if(!VALID.test(k)||!l||typeof l!=='object')continue;const o={ex:{},alt:{},pain:null,t0:num(l.t0),t1:num(l.t1)};
    const p=num(l.pain);o.pain=p!=null&&p>=0&&p<=10?Math.round(p):null;const pr=num(l.pre);o.pre=pr!=null&&pr>=0&&pr<=10?Math.round(pr):null;if(MODES[l.mode])o.mode=l.mode;if(l.showAll)o.showAll=true;if(Array.isArray(l.autoAlt))o.autoAlt=l.autoAlt.filter(x=>/^[a-z0-9]{2,6}$/.test(x)).slice(0,20);

    for(const[ek,e]of Object.entries(l.ex||{})){if(!/^[a-z0-9]{2,6}(~a)?$/.test(ek)||!e||!Array.isArray(e.s))continue;o.ex[ek]={s:e.s.slice(0,8).map(s=>({d:s&&s.d?1:0,w:str(s&&s.w),r:str(s&&s.r)}))};const m=num(e.m);if(m!=null&&m>=0&&m<=10)o.ex[ek].m=Math.round(m)}

}

function molMap(){

$('#v-guide').innerHTML=`
<h2>Cómo usarla</h2>
<p>Instalada en la pantalla de inicio funciona sin conexión. Mientras la sesión está en marcha, la pantalla se mantiene encendida para que el aviso de descanso suene. Si la bloqueas, iOS pausa la app y el aviso puede no sonar. Exporta el historial de vez en cuando: es tu copia de seguridad.</p>
<p>Elige semana y día. Al marcar una serie arranca el descanso de ese ejercicio y suena (y vibra en Android) al terminar. Los isométricos tienen botón ▶ que guía cada aguante y marca la serie al acabar. En los campos vacíos aparece en gris lo que anotaste la semana anterior. Si tienes el móvil bloqueado o la pestaña en segundo plano puede que no suene: el iPhone no vibra desde el navegador.</p>
<h2>Progresión de 8 semanas <span class="tag cr">Criterio</span></h2>
<div class="scroll"><table class="stack"><thead><tr><th>Sem</th><th>Fase</th><th>RIR comp. / aisl.</th><th>Series ★</th><th>Lumbar</th></tr></thead><tbody>
${[1,2,3,4,5,6,7,8].map(w=>{const W=WEEKS[w];return`<tr><td>${w}</td><td>${W.t}</td><td>${W.rir} / ${W.rirI}</td><td>${W.dl?'≈60 % de todo':W.add?'+1':'base'}</td><td>Fase ${phase(w)+1}</td></tr>`}).join('')}
</tbody></table></div>
<h3>Cargas: doble progresión</h3>
<p>Trabaja dentro del rango de reps. Cuando completes <b>todas</b> las series en el tope del rango con el RIR de la semana, sube la carga lo mínimo (2,5 kg en barra/máquina, siguiente mancuerna) y vuelve al mínimo del rango. En la semana 5 baja las cargas 10–15 %. Después de la semana 8 conviene otra descarga antes del siguiente bloque.</p>
<p class="note">RIR = repeticiones que te quedan en reserva. RIR 2 = podrías hacer 2 más con buena técnica.</p>
<h2>Calentamiento lumbar</h2>
<ol class="wu">${WU_BASE.map(x=>`<li>${x}</li>`).join('')}<li>Específico del día y series de aproximación (en cada día).</li></ol>
<h2>Bloque lumbar y core <span class="tag cr">Criterio</span></h2>
<p>Reducido a 2 días: <b>Pull A</b> (bird dog y plancha lateral) y <b>Legs B</b> (dead bug y Pallof). Va <b>al inicio</b>, justo después del calentamiento, con máximo 2 series y unos 5 minutos: así lo haces fresco y sirve de activación, en vez de cargar una zona ya cansada al final. La progresión es de tiempo de aguante, no de series. Quité las extensiones lumbares, el pull-through, el suitcase carry, el curl-up y la plancha frontal porque te molestaban más de lo que aportaban. Prioriza resistencia y control con la columna en neutro, porque la flexión es lo que te molesta. La extensión solo llega hasta neutro, nunca más allá.</p>
<ul><li><b>Fase 1 (sem 1–2 y 5):</b> bird dog con pausa de 5 s, plancha lateral de 20 s, dead bug lento, Pallof sin pausa.</li>
<li><b>Fase 2 (sem 3–4):</b> pausas de 8 s, planchas de 30 s, dead bug y Pallof con 2–3 s de pausa.</li>
<li><b>Fase 3 (sem 6–8):</b> pausas de 10 s, planchas de 40 s y banda ligera en el dead bug.</li></ul>
<p>Si alguno de estos cuatro también te molesta (marca la molestia), usa su alternativa. Si la alternativa también molesta, quítalo y coméntaselo al fisio.</p>
<p><b>Para pasar de fase</b> deben cumplirse las tres condiciones: dolor durante los ejercicios ≤2/10, dolor al terminar la sesión dentro de tu basal (0–2) y a la mañana siguiente no peor que antes. Si no se cumplen, repite la fase. La app avanza la fase por semana; si no cumples, usa la alternativa o los números de la fase anterior.</p>
<h2>Sentadilla con barra: opcional <span class="tag cr">Criterio</span></h2>
<p>Solo desde la semana 6 y solo si cumples <b>todo</b> esto: dolor basal 0–2 las últimas 2 semanas, ningún registro post-sesión de Legs por encima de 2, hack squat y búlgara sin molestia, y ese día 0–1/10 tras calentar.</p>
<ul><li>Sustituye al hack squat como primer ejercicio de Legs A. Empieza con ~50 % de lo que movías antes, 3×6–8 a RIR 3, y sube como máximo 5 kg/semana.</li><li>Siempre en rack con las barras de seguridad a la altura de tu punto más bajo, porque entrenas sin spotter.</li><li>Barra alta, profundidad hasta donde la pelvis no se mete (sin «butt wink»).</li><li>Abandónala si durante la serie pasas de 3/10, si al día siguiente estás por encima de tu basal o si notas que la lumbar se redondea al bajar.</li></ul>
<h2>Señales de alerta</h2>
<h3>Para y consulta (urgencias si es lo primero)</h3>
<ul><li>Pérdida de control de orina o heces, adormecimiento en la zona genital o entre las piernas, debilidad que avanza en una pierna: <b>urgencias</b>. <span class="tag ev">Evidencia</span></li>
<li>Dolor que baja por la pierna (sobre todo por debajo de la rodilla), hormigueo o entumecimiento. <span class="tag ev">Evidencia</span></li>
<li>Dolor nocturno constante que no cambia con la postura, o con fiebre o pérdida de peso sin explicación. <span class="tag ev">Evidencia</span></li></ul>
<h3>Para el ejercicio y modifícalo <span class="tag cr">Criterio</span></h3>
<ul><li>Dolor punzante o «pinchazo» en lugar de fatiga muscular.</li><li>Dolor durante la serie por encima de 3/10 o más de 2 puntos sobre tu basal.</li><li>Dolor que sube serie a serie.</li><li>Para terminar las reps tienes que redondear o arquear la lumbar: corta la serie.</li><li>Al día siguiente estás peor que tu basal o te dura más de 24 h.</li></ul>
<p><b>Qué hacer, en orden:</b> 1) baja la carga 20–30 % o acorta el rango; 2) cambia a la alternativa; 3) quita ese ejercicio esa sesión; 4) si te pasa dos sesiones seguidas, consulta con tu fisio.</p>
<h2>Medidores de dolor <span class="tag cr">Criterio</span></h2>
<ul><li><b>Al abrir la app</b> eliges día y dolor lumbar, y la sesión se arma sola. Con 0–2 hay <b>sesión completa</b>. Con 3–4 hay <b>sesión ajustada</b>: sin series extra ★, RIR +1, sin subir cargas y el bloque lumbar una fase más abajo. Con 5 o más en Pull o Legs hay <b>recuperación</b>: calentamiento, bloque lumbar fase 1 y cardio suave. En Push, con 5 o más, la sesión es ajustada: los empujes van sentados o apoyados. Al cerrar, la app compara el dolor de antes con el de después.</li>
<li><b>Cambio automático a alternativa</b>: al empezar, un ejercicio pasa a su alternativa si marcó molestia de 3 o más en dos sesiones, o si la última vez marcó 3 o más y hoy empiezas con dolor de 3 o más.</li>
<li><b>Molestia por ejercicio</b>: anótala al terminar el ejercicio, solo si notaste algo en la lumbar. Con 3 o más dos veces, ese ejercicio pasa a su alternativa. En «Datos» tienes el mapa de los que más te alborotan.</li>
<li>La molestia de un ejercicio que se nota al día siguiente no se ve en el momento: si amaneces peor que tu basal, revisa en el mapa qué ejercicios marcaron algo.</li></ul>
<h2>Ejercicios descartados y su reemplazo</h2>
<table class="stack"><thead><tr><th>Ejercicio típico</th><th>Por qué</th><th>Lo reemplaza</th></tr></thead><tbody>${DISC.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>
<h2>Qué es evidencia y qué es criterio</h2>
<p class="note">Lo marcado como evidencia sale de conocimiento general de guías y revisiones, no de fuentes que haya consultado para esta rutina. Contrástalo con tu fisio.</p>
<h3><span class="tag ev">Evidencia general</span></h3>
<ul><li>Las guías clínicas recomiendan el ejercicio para el dolor lumbar crónico. No hay un tipo de ejercicio claramente superior: funciona el que toleras y haces con constancia.</li>
<li>Para hipertrofia es habitual un rango de ~10–20 series semanales por músculo, con cada músculo entrenado al menos 2 veces por semana. Por encima de eso los beneficios son decrecientes.</li>
<li>Entrenar a 0–3 RIR produce hipertrofia comparable. No hace falta llegar al fallo.</li>
<li>Recomposición: proteína de ~1,6–2,2 g/kg/día, déficit calórico moderado y fuerza mantenida o en aumento.</li>
<li>La artrosis facetaria se asocia a menudo con dolor en extensión. A ti te duele la flexión y los ejercicios de bisagra cargada. Puede que haya otro componente, o simplemente que tú respondes así: la rutina sigue tus síntomas, no el patrón «típico». Coméntalo con tu médico.</li></ul>
<h3><span class="tag cr">Mi criterio / estimación</span></h3>
<ul><li>Que los remos con apoyo de pecho descarguen la lumbar es razonamiento biomecánico, no un ensayo clínico concreto.</li>
<li>La selección concreta de ejercicios, series, orden y descansos.</li>
<li>La descarga en la semana 5 y las 3 fases del bloque lumbar. Los ejercicios tipo McGill tienen sobre todo respaldo biomecánico y clínico, con pocos ensayos que los comparen con otras opciones.</li>
<li>Los umbrales de dolor (≤3/10, +2 sobre basal, 24 h) son una adaptación del «modelo de monitorización del dolor», que se estudió sobre todo en tendinopatías.</li>
<li>El volumen de espalda (~30 series/semana contando deltoides posterior) está en la parte alta. Si no recuperas o las sesiones pasan de 75 min, quita primero las series extra ★ y el jalón de Legs B.</li></ul>
<h3>Lo que no sé</h3>
<ul><li>Tu edad, peso, cargas y el plan exacto de tu fisio. Si te dio ejercicios concretos, esos mandan sobre el bloque lumbar de aquí.</li></ul>`;

let EP=null;
function sessStats(w,d){
  const l=L(w,d)||{},pr=prog(w,d),exs=EX[d].filter(ex=>!spec(ex,w,d).hidden);
  const full=exs.filter(ex=>{const sp=spec(ex,w,d),s=setsOf(w,d,ex);return[...Array(sp.sets).keys()].every(i=>s[i]&&s[i].d)}).length;
  const mol=[],up=[];
  for(const ex of exs){const k=keyOf(ex,l),e=l.ex&&l.ex[k],nm=isAlt(ex,l)?ex.alt.n:spec(ex,w,d).name;
    if(e&&e.m!=null&&e.m>=3)mol.push(nm+' ('+e.m+')');
    const mx=a=>Math.max(0,...(a||[]).map(x=>parseFloat(String(x.w).replace(',','.'))||0));
    const now=mx(e&&e.s);if(now>0){let before=0;for(let pw=1;pw<w;pw++){const pl=L(pw,d),pe=pl&&pl.ex[k];before=Math.max(before,mx(pe&&pe.s))}if(before>0&&now>before)up.push(nm+' '+before+' → '+now+' kg')}}
  return{dur:l.t0?((l.t1||Date.now())-l.t0)/1000:0,n:pr.n,t:pr.t,full,total:exs.length,pre:l.pre,pain:l.pain,mol,up};
}

   <div class="stats" style="margin-top:10px"><div><b>${fmt(st.dur)}</b><small>duración</small></div><div><b>${st.n}/${st.t}</b><small>series</small></div><div><b>${st.full}/${st.total}</b><small>ejercicios completos</small></div></div>
   ${miss?`<div class="msg w">Te faltan ${miss} series. Si terminas ahora, quedan guardadas como no hechas; puedes reabrir la sesión después.</div>`:''}
   <div class="lbl">Dolor lumbar ahora (0–10)${st.pre!=null?' · antes de empezar: '+st.pre:''}</div>${scale('end-p',EP)}
   ${painMsg(EP)}
   <div class="row"><button class="btn" data-end-go="1">Terminar sesión</button></div>
   <div class="row"><button class="btn ghost" data-end-no="1">Seguir entrenando</button></div>`;
}
$('#endM').addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.id==='endM')$('#endM').hidden=true;return}const D=b.dataset;
  if(D.endP!=null){const v=+D.endP;EP=EP===v?null:v;renderEnd();return}
  if(D.endNo){$('#endM').hidden=true;return}
  if(D.endGo){const l=cur(true);if(EP!=null)l.pain=EP;if(!l.t0)l.t0=Date.now();l.t1=Date.now();stopRest();save();$('#endM').hidden=true;if($('#v-train').hidden)showTab('train');else renderTrain();setTimeout(()=>$('#sumBox')?.scrollIntoView({block:'start'}),60);beep(2,700,.15)}
});
const sameDay=t=>{const a=new Date(t),b=new Date();return a.toDateString()===b.toDateString()};

/* ---------- PANTALLA DE INICIO ---------- */
let P=null;
function suggest(){let best=null;for(const[k,l]of Object.entries(S.log))if(l.t1&&(!best||l.t1>best.t)){const[w,d]=k.split('|');best={w:+w,d,t:l.t1}}
  if(!best)return{w:1,d:'pushA'};let w=best.w,i=DAYS.findIndex(x=>x.id===best.d);for(let n=0;n<48;n++){i++;if(i>=DAYS.length){i=0;w++}if(w>8)return{w:8,d:'legsB'};const l=L(w,DAYS[i].id);if(!l||!l.t1)return{w,d:DAYS[i].id}}return{w:8,d:'legsB'}}
function ongoing(){for(const[k,l]of Object.entries(S.log))if(l.t0&&!l.t1&&Date.now()-l.t0<5*3600e3){const[w,d]=k.split('|');return{w:+w,d,l}}return null}
function autoAlts(w,d,pre){const out=[];for(const ex of EX[d]){const v=[];for(let pw=1;pw<=8;pw++){if(pw===w)continue;const l=L(pw,d),e=l&&l.ex[ex.id];if(e&&e.m!=null)v.push(e.m)}const hi=v.filter(x=>x>=3).length,last=v[v.length-1];if(hi>=2||(pre!=null&&pre>=3&&last>=3))out.push({ex,last})}return out}
function openStart(keep){const sg=suggest();P={w:S.w,d:S.d,pain:null,sg};const l=cur();if(!keep&&!(l&&l.t0&&!l.t1)){P.w=sg.w;P.d=sg.d}if(keep&&l&&l.pre!=null)P.pain=l.pre;renderStart();$('#startM').hidden=false;$('#startM').scrollTop=0}
function renderStart(){
  const og=ongoing(),m=modeFor(P.pain,P.d),W=WEEKS[P.w],ex=EX[P.d],lumb=/^(pull|legs)/.test(P.d);
  const alts=P.pain==null?[]:autoAlts(P.w,P.d,P.pain);
  const ph=m==='normal'?phase(P.w):m==='ajustada'?Math.max(0,phase(P.w)-1):0;
  const strength=ex.filter(x=>!x.core).length,core=ex.filter(x=>x.core).length;
  const done=L(P.w,P.d)&&L(P.w,P.d).t1;
  let pv='';
  if(P.pain==null)pv='<p class="note" style="margin:0">Marca tu dolor lumbar de ahora para armar la sesión.</p>';
  else{const items=m==='normal'?[`${strength} ejercicios de fuerza${core?' + bloque lumbar fase '+(ph+1):''}.`,`RIR de la semana: ${W.rir} en compuestos, ${W.rirI} en aislamiento.`,W.add&&!W.dl?'Incluye las series extra ★ de espalda y bíceps.':'']
     :m==='ajustada'?['Sin series extra ★ y RIR +1 en todo.','No subas cargas hoy: repite las de la semana anterior o baja un 10 %.',core?`Bloque lumbar en fase ${ph+1} (una por debajo de la de esta semana).`:'',!lumb?'Push: todo sentado o apoyado. Si la extensión de tríceps de pie te hace arquear, usa su alternativa sentada.':'']
     :[core?'Solo calentamiento lumbar, bloque lumbar en fase 1 y 15–20 min de cardio suave.':'Solo calentamiento lumbar y 15–20 min de cardio suave.','La fuerza queda oculta; puedes mostrarla desde la sesión si al calentar el dolor baja a 0–2.','Si el dolor no baja en unos días o va hacia la pierna, consulta (Guía → Señales de alerta).'];
   pv=`<h3>${MODES[m].t}</h3><ul>${items.filter(Boolean).map(x=>`<li>${x}</li>`).join('')}${alts.map(a=>`<li>Cambio a alternativa: <b>${esc(a.ex.n)}</b> → ${esc(a.ex.alt.n)} (última molestia ${a.last}/10).</li>`).join('')}</ul>`}
  const today=Object.entries(S.log).filter(([k,l])=>l.t1&&sameDay(l.t1)).map(([k,l])=>{const[w,d]=k.split('|');return{w:+w,d,l}});
  $('#startBody').innerHTML=`${today.map(t=>`<div class="msg ok" style="margin-top:12px">Hoy terminaste <b>${dayName(t.d)} · semana ${t.w}</b> (${fmt((t.l.t1-t.l.t0)/1000)}).</div><div class="row"><button class="btn ghost" data-st-view="${t.w}|${t.d}">Ver resumen de hoy</button></div>`).join('')}${og?`<div class="msg w" style="margin-top:12px">Tienes <b>${dayName(og.d)} · semana ${og.w}</b> en curso (${fmt((Date.now()-og.l.t0)/1000)}).</div><div class="row"><button class="btn blue" data-st-cont="1">Continuar esa sesión</button></div>`:''}
   <div class="lbl">Semana</div><div class="weeks">${[1,2,3,4,5,6,7,8].map(w=>`<button data-st-w="${w}" class="${WEEKS[w].dl?'dl':''}" aria-pressed="${w===P.w}">${w}</button>`).join('')}</div>
   <div class="lbl">Día</div><div class="days">${DAYS.map(d=>{const lg=L(P.w,d.id),sg=P.sg.w===P.w&&P.sg.d===d.id;return`<button data-st-d="${d.id}" class="${sg?'sug':''}" aria-pressed="${d.id===P.d}"><b>${d.n}</b><span>${d.f}${lg&&lg.t1?' · hecho':''}</span>${sg?'<span class="sugt">Sugerido</span>':''}</button>`}).join('')}</div>
   <div class="lbl">Dolor lumbar ahora (0–10) · tu basal es 0–2</div>${scale('st-p',P.pain)}
   <div class="prev2">${pv}</div>
   ${done?'<div class="msg w">Ya cerraste este día en esta semana. Si lo empiezas, se reabre con lo que tenías anotado.</div>':''}
   <div class="row"><button class="btn" data-st-go="1" ${P.pain==null?'disabled':''}>Empezar sesión</button></div>
   <div class="row"><button class="btn ghost" data-st-close="1">Solo ver la rutina</button></div>`;
}
$('#startM').addEventListener('click',e=>{
  audio();const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.stW){P.w=+D.stW;renderStart();return}
  if(D.stD){P.d=D.stD;renderStart();return}
  if(D.stP!=null){const v=+D.stP;P.pain=P.pain===v?null:v;renderStart();return}
  if(D.stView){const[w,d]=D.stView.split('|');S.w=+w;S.d=d;save();$('#startM').hidden=true;showTab('train');setTimeout(()=>$('#sumBox')?.scrollIntoView({block:'start'}),60);return}
  if(D.stCont){const og=ongoing();S.w=og.w;S.d=og.d;save();$('#startM').hidden=true;showTab('train');return}
  if(D.stClose){$('#startM').hidden=true;renderTrain();return}
  if(D.stGo&&P.pain!=null){S.w=P.w;S.d=P.d;const l=cur(true);l.pre=P.pain;l.mode=modeFor(P.pain,P.d);l.showAll=false;
    const al=autoAlts(P.w,P.d,P.pain);l.autoAlt=al.map(a=>a.ex.id);for(const a of al)l.alt[a.ex.id]=true;
    if(l.t1)l.t1=null;if(!l.t0)l.t0=Date.now();save();$('#startM').hidden=true;showTab('train')}
});

renderTrain();
openStart();
}
</script>
</body>
</html>
